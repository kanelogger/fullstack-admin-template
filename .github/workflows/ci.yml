name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Check route registry
        run: pnpm check:routes
      - name: Check documentation references
        run: pnpm check:docs
      - name: Lint
        run: pnpm lint
      - name: Install PC Chromium
        run: pnpm --filter fullstack-admin-frontend exec playwright install --with-deps chromium
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test:unit
      - name: PC browser tests
        run: pnpm test:e2e:mock
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mock-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Disposable Supabase migration and integration checks
        run: pnpm check:migrations
      - name: Migration track upgrade checks
        run: pnpm check:migration-upgrades

name: fullstack-admin-template-test-db

services:
  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?Run setup.mjs prepare first}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Run setup.mjs prepare first}
      MYSQL_USER: ${MYSQL_USER:?Run setup.mjs prepare first}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run setup.mjs prepare first}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:?Run setup.mjs prepare first}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

volumes:
  mysql_data:

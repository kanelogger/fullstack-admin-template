schema_version: 2

project:
  id: fullstack-admin-template
  name: fullstack-admin-template
  summary: "PC browser admin template: Vue 3, TypeScript, Vite, pnpm, Zod and Supabase"
  in_scope: [frontend, supabase, scripts, rules, specs, tasks, workflow, docs, .agents, .github]
  out_of_scope: ["production data", "production deployment", "mobile browser acceptance"]

repositories:
  primary: "."
  related: []

workspace:
  current_checkout_root: "."
  root_probe: "git rev-parse --show-toplevel"
  project_identity: "https://github.com/kanelogger/fullstack-admin-template.git"
  project_scope_resource_roots: [".", frontend, supabase, scripts, .agents/skills]
  local_state_root: .agents/state
  worktree_policy: docs/agent-environment/network-filesystem.md
  worktree_aware: unknown

environment:
  supported_os: unknown
  supported_architectures: unknown
  toolchains:
    node: {source: "package.json#engines.node"}
    pnpm: {source: "package.json#engines.pnpm"}
    supabase_cli: {source: "frontend/package.json#devDependencies.supabase"}
    deno: {source: "package.json#devDependencies.deno"}
    postgres: {source: "supabase/config.toml#[db].major_version", version: 17}
    local_docker_runtime: orbstack
  probe_guide: docs/agent-environment/capabilities.md
  local_probe_results: .agents/state/environment.json
  toolchain_guide: docs/agent-environment/local-toolchain.md

commands:
  install:
    workspace:
      command: "pnpm install --frozen-lockfile"
      cwd: .
      command_ref: "package.json#scripts"
      network: package-registry
      side_effects: [node_modules]
  develop:
    application:
      command: "pnpm dev"
      cwd: .
      command_ref: "package.json#scripts.dev"
      requires: [workspace-dependencies, local-supabase, local-env, docker-compatible-runtime]
      side_effects: [edge-function-server, vite-server, frontend-cache]
  typecheck:
    workspace:
      command: "pnpm typecheck"
      cwd: .
      command_ref: "package.json#scripts.typecheck"
  build:
    frontend:
      command: "pnpm build"
      cwd: .
      command_ref: "package.json#scripts.build"
      side_effects: [frontend/dist]
  test:
    docs:
      command: "pnpm check:docs"
      cwd: .
      command_ref: "package.json#scripts.check:docs"
    unit:
      command: "pnpm test:unit"
      cwd: .
      command_ref: "package.json#scripts.test:unit"
    components:
      command: "pnpm test:components"
      cwd: .
      command_ref: "package.json#scripts.test:components"
      requires: [workspace-dependencies]
      side_effects: [vitest-jsdom-process]
    visual_baselines:
      command: "pnpm test:visual"
      cwd: .
      command_ref: "package.json#scripts.test:visual"
      requires: [docker-compatible-runtime, pinned-playwright-visual-image]
      side_effects: [temporary-source-copy, temporary-visual-container, playwright-report/visual, test-results/visual]
    visual_baseline_update:
      command: "pnpm test:visual:update"
      cwd: .
      command_ref: "package.json#scripts.test:visual:update"
      requires: [docker-compatible-runtime, pinned-playwright-visual-image, explicit-baseline-review]
      side_effects: [temporary-source-copy, visual-snapshot-png-files]
    dashboard_agent:
      command: "pnpm test:agent:start -- --scenario dashboard --browser <instance-id>"
      cwd: .
      command_ref: "package.json#scripts.test:agent:start"
      requires: [docker-compatible-runtime, connected-explicit-browser-skill-instance, browser-skill-extension, browser-skill-debug-capability]
      side_effects: [unique-temporary-supabase-project, unique-service-ports, temporary-dashboard-fixtures, vite-process, edge-function-process, browser-skill-session]
    dashboard_agent_cleanup:
      command: "pnpm test:agent:cleanup -- --run-id <id>"
      cwd: .
      command_ref: "package.json#scripts.test:agent:cleanup"
      requires: [dashboard-agent-run-id]
      side_effects: [export-browser-evidence, verify-required-evidence, downgrade-pass-when-evidence-missing, stop-recorded-browser-session, stop-and-verify-owned-processes, stop-owned-temporary-supabase-stack, preserve-project-directory-on-stack-stop-failure, remove-temporary-credentials]
    browser_mock:
      command: "pnpm test:e2e:mock"
      cwd: .
      command_ref: "package.json#scripts.test:e2e:mock"
      requires: [workspace-dependencies, pc-chromium]
      side_effects: [vite-test-server, playwright-report/mock, test-results/mock]
    browser_local_auth:
      command: "pnpm test:e2e:local"
      cwd: .
      command_ref: "package.json#scripts.test:e2e:local"
      requires: [local-supabase, local-mailpit, pc-chromium]
      side_effects: [edge-function-server, vite-test-server, temporary-auth-fixtures, temporary-mailpit-message, playwright-report/local-auth, test-results/local-auth]
    local_database:
      command: "pnpm test:db"
      cwd: .
      command_ref: "package.json#scripts.test:db"
      requires: [local-supabase, local-mailpit]
      side_effects: [temporary-auth-fixtures, temporary-database-fixtures, edge-function-server]
    disposable_migrations:
      command: "pnpm check:migrations"
      cwd: .
      command_ref: "package.json#scripts.check:migrations"
      requires: [workspace-dependencies, docker-compatible-runtime, pc-chromium]
      side_effects: [temporary-project-directory, unique-supabase-project, unique-service-ports, temporary-containers-and-volume]
    migration_upgrades:
      command: "pnpm check:migration-upgrades"
      cwd: .
      command_ref: "package.json#scripts.check:migration-upgrades"
      requires: [workspace-dependencies, docker-compatible-runtime]
      side_effects: [temporary-project-directory, unique-supabase-projects, unique-service-ports, temporary-containers-and-volumes, temporary-upgrade-fixtures]
  supabase:
    local_start:
      command: "pnpm supabase:start"
      cwd: .
      command_ref: "package.json#scripts.supabase:start"
      requires: [docker-compatible-runtime]
      side_effects: [supabase-local-containers, local-database-volume, local-service-ports]
    local_stop:
      command: "pnpm supabase:stop"
      cwd: .
      command_ref: "package.json#scripts.supabase:stop"
      requires: [docker-compatible-runtime]
      side_effects: [stop-current-workspace-supabase-containers]
    local_reset:
      command: "pnpm supabase:db:reset"
      cwd: .
      command_ref: "package.json#scripts.supabase:db:reset"
      requires: [docker-compatible-runtime, confirmed-disposable-local-project, human-approval]
      side_effects: [drop-and-recreate-current-local-database]
  template:
    initialize:
      command: "pnpm template:init -- --project-id <id> --title <title>"
      cwd: .
      command_ref: "package.json#scripts.template:init"
      requires: [docker-compatible-runtime, no-local-supabase-state, first-initialization]
      side_effects: [project-config-files, project-initialization-marker]
    select_migration_track:
      command: "pnpm template:select-migrations -- --track <history|baseline>"
      cwd: .
      command_ref: "package.json#scripts.template:select-migrations"
      requires: [docker-compatible-runtime, no-local-supabase-state, before-first-database-start]
      side_effects: [active-migration-directory, archived-history, migration-track-marker]
    sync_migrations:
      command: "pnpm template:sync-migrations"
      cwd: .
      command_ref: "package.json#scripts.template:sync-migrations"
      side_effects: [baseline-incremental-migration-copies]
  lint:
    command: "pnpm lint"
    cwd: .
    command_ref: "package.json#scripts.lint"
    scope: "frontend Vue/TypeScript, shared contracts, Deno Edge Functions and repository scripts"
  route_registry:
    command: "pnpm check:routes"
    cwd: .
    command_ref: "package.json#scripts.check:routes"
    scope: "RouteKey contract, route metadata, import files and Git ignore/tracking state"
  e2e: pc-chromium-playwright
  browser_test: playwright
  execution_guide: docs/agent-environment/commands.md
  validation_policy: rules/testing.md

authoritative_context:
  agent_entry: AGENTS.md
  ai_environment: AI_ENVIRONMENT.md
  architecture: specs/architecture.md
  source_manifests: [package.json, frontend/package.json, supabase/functions/_shared/contracts/package.json]
  rules: rules/README.md
  specs: specs/
  decisions: docs/adr/

capabilities:
  skill_sources: .agents/skills.sources.json
  local_skills:
    - .agents/skills/agents-maintenance/SKILL.md
    - .agents/skills/tailwind-design-system/SKILL.md
    - .agents/skills/shadcn/SKILL.md
    - .agents/skills/typescript-advanced-types/SKILL.md
    - .agents/skills/supabase-postgres-best-practices/SKILL.md
    - .agents/skills/supabase/SKILL.md
  mcp: not-applicable
  hooks: not-applicable

workflow:
  definitions: [tasks/README.md, workflow/README.md]
  default: "aligning -> implementing -> verifying -> idle; blocked records reason and recovery condition"
  active_state: .agents/state/workflow.json
  verification_guide: rules/testing.md
  evidence_root: .agents/state/evidence/

permissions:
  default: read-only
  write_roots: ["."]
  local_reversible_edits: allowed-when-authorized
  external_system_writes: approval-required
  require_human_approval: [publish, production-write, external-system-write, reset-current-local-database]
  policy: rules/security.md

freshness:
  scope: "repository source manifests, Supabase config/migrations, CI and test scripts"
  evidence: [package.json, pnpm-lock.yaml, frontend/package.json, supabase/config.toml, supabase/migrations/, supabase/baselines/, supabase/functions/, supabase/tests/, scripts/check-docs.mjs, scripts/check-migration-upgrades.mjs, .github/workflows/ci.yml, .gitignore]
  verified_at: "2026-10-06"
  owner: template-maintainer
  status: verified-static
  refresh_triggers: [toolchain-change, dependency-change, workflow-change, permission-change, service-configuration-change]

completion:
  definition: "final source passes docs, zero-warning lint, typecheck, build, unit tests, PC browser tests, historical empty replay and retained-data dual-track migration upgrades; report actual incremental count and any unrun or failed checks"
